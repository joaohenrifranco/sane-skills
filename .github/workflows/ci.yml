name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/vet.sh

  browse:
    # Pinned: Playwright 1.59 does not support Chromium on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: skills/sane-browse/browse
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      # Headed/handoff tests run under Xvfb, which the browser starts itself.
      - run: sudo apt-get install -y xvfb
      - run: bun run typecheck
      - run: bun test --timeout 90000
